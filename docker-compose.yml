version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: skillsafe-postgres
    restart: always
    environment:
      POSTGRES_DB: skillsafe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - skillsafe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillsafe-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/skillsafe
      FASTAPI_URL: http://127.0.0.1:8000
      SECRET_KEY: skillsafe_vr_production_secret_key_2026
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-330255293981-t79ggd6cdelkgp5ksf43vtrdbi65lpfn.apps.googleusercontent.com}
      GROQ_API_KEY: ${GROQ_API_KEY:-}


volumes:
  skillsafe_pgdata:
    driver: local
