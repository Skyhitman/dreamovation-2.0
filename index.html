/* =========================================================================
   ⚡ SKILLSAFE VR ENTERPRISE ARCHITECTURE STYLES (v6.0)
   ========================================================================= */

/* Top Navigation Bar */
nav#main-nav {
  display: flex !important;
  gap: 10px !important;
  align-items: center !important;
  justify-content: space-between !important;
  padding: 0 18px !important;
  background: rgba(11, 18, 30, 0.95) !important;
  backdrop-filter: blur(16px) !important;
  border-bottom: 1.5px solid rgba(56, 189, 248, 0.25) !important;
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  right: 0 !important;
  height: 60px !important;
  min-height: 60px !important;
  max-height: 60px !important;
  z-index: 1000 !important;
  flex-wrap: nowrap !important;
  overflow: visible !important;
  box-sizing: border-box !important;
}

/* Desktop vs Mobile responsive nav visibility */
.nav-desktop-only {
  display: inline-flex !important;
  align-items: center;
}
.nav-mobile-only {
  display: none !important;
}
@media (max-width: 1180px) {
  .nav-desktop-only { display: none !important; }
  .nav-mobile-only { display: flex !important; align-items: center; }
}

.brand-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  margin-right: 4px;
}
.brand-wrap:hover { opacity: 0.9; }

.brand-logo {
  font-size: 18px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.5px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.brand-logo span { color: var(--ac); }
.brand-badge {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  background: linear-gradient(135deg, #0284c7, #38bdf8);
  color: #04121c;
  padding: 2px 7px;
  border-radius: 99px;
  letter-spacing: 0.5px;
}

/* Role Selector Pills */
.role-nav-group {
  display: inline-flex;
  align-items: center;
  background: #090e17;
  border: 1px solid #1e293b;
  border-radius: 99px;
  padding: 3px;
  gap: 3px;
}
.role-nav-btn {
  background: none;
  border: 0;
  color: #94a3b8;
  font-size: 12px;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: 99px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.role-nav-btn:hover {
  color: #fff;
  background: #1e293b;
}
.role-nav-btn.active {
  background: var(--ac);
  color: #04121c;
  font-weight: 800;
  box-shadow: 0 0 14px rgba(56, 189, 248, 0.4);
}

/* Nav Menu Links */
.nav-link-btn {
  background: none;
  border: 0;
  color: #cbd5e1;
  font-size: 13px;
  font-weight: 600;
  padding: 6px 10px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.nav-link-btn:hover {
  background: #1e293b;
  color: #fff;
}
.nav-link-btn.active {
  background: #0369a133;
  color: var(--ac);
  border: 1px solid #38bdf866;
}

/* Institution Select */
.inst-select-box {
  background: #090e17;
  border: 1px solid #1e293b;
  color: #38bdf8;
  border-radius: 8px;
  padding: 5px 8px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  outline: none;
  max-width: 175px;
  text-overflow: ellipsis;
}
.inst-select-box:focus { border-color: var(--ac); }

/* User Profile Badge */
.user-profile-badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: #1e293b66;
  border: 1px solid #334155;
  border-radius: 99px;
  padding: 3px 10px 3px 4px;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
}
.user-profile-badge:hover {
  border-color: var(--ac);
  background: #1e293b;
}
.user-avatar-circle {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: linear-gradient(135deg, #0284c7, #38bdf8);
  color: #04121c;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 11px;
}
.user-meta-txt {
  font-size: 12px;
  font-weight: 700;
  color: #f1f5f9;
  line-height: 1.1;
  display: flex;
  flex-direction: column;
}
.user-meta-txt small {
  font-size: 9px;
  font-weight: 500;
  color: #94a3b8;
}

/* Sub-Tab Navigation Header */
.sub-tab-bar {
  display: flex;

      case 'heavy': navigator.vibrate(70); break;

function playArcFlashAudio() {
  if (!snd) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const now = AC.currentTime;

    // A. Explosive Low-End Boom (90Hz drop to 20Hz)
    const boom = AC.createOscillator();
    const boomGain = AC.createGain();
    boom.type = 'triangle';
    boom.frequency.setValueAtTime(90, now);
    boom.frequency.exponentialRampToValueAtTime(20, now + 0.9);
    boomGain.gain.setValueAtTime(0.45, now);
    boomGain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
    boom.connect(boomGain);
    boomGain.connect(AC.destination);
    boom.start(now);
    boom.stop(now + 1.3);

    // B. Muffled Acoustic Resonance (lowpass noise punch)
    const bufSize = AC.sampleRate * 0.4;
    const noiseBuf = AC.createBuffer(1, bufSize, AC.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.3));
    const noiseSrc = AC.createBufferSource();
    noiseSrc.buffer = noiseBuf;
    const filter = AC.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(250, now);
    const noiseGain = AC.createGain();
    noiseGain.gain.setValueAtTime(0.5, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
    noiseSrc.connect(filter);
    filter.connect(noiseGain);
    noiseGain.connect(AC.destination);
    noiseSrc.start(now);

    // C. High-Pitched Tinnitus Ringing (3800 Hz sinusoid)
    const ring = AC.createOscillator();
    const ringGain = AC.createGain();
    ring.type = 'sine';
    ring.frequency.setValueAtTime(3800, now);
    ringGain.gain.setValueAtTime(0.001, now);
    ringGain.gain.linearRampToValueAtTime(0.18, now + 0.05);
    ringGain.gain.exponentialRampToValueAtTime(0.001, now + 4.5);
    ring.connect(ringGain);
    ringGain.connect(AC.destination);
    ring.start(now + 0.05);
    ring.stop(now + 4.6);
  } catch(e) {}
}

// Update simulation arc flash particles & shockwave in loop
function updateArcFlashFX(dt) {
  if (arcFlashShockwave) {
    arcFlashShockwave.scale.addScalar(dt * 12.0 * window.simTimeScale);
    arcFlashShockwave.material.opacity -= dt * 0.9 * window.simTimeScale;
    if (arcFlashShockwave.material.opacity <= 0.05) {
      if (arcFlashShockwave.parent) arcFlashShockwave.parent.remove(arcFlashShockwave);
      arcFlashShockwave = null;
    }
  }
  if (arcFlashSparks) {
    const pos = arcFlashSparks.geometry.attributes.position.array;
    const vel = arcFlashSparks.userData.velArr;
    const n = pos.length / 3;
    for(let i = 0; i < n; i++) {
      pos[i*3] += vel[i*3] * dt * window.simTimeScale;
      pos[i*3+1] += vel[i*3+1] * dt * window.simTimeScale;
      pos[i*3+2] += vel[i*3+2] * dt * window.simTimeScale;
      vel[i*3+1] -= 9.8 * dt * window.simTimeScale; // gravity
    }
    arcFlashSparks.geometry.attributes.position.needsUpdate = true;
    arcFlashSparks.material.opacity -= dt * 0.45 * window.simTimeScale;
    if (arcFlashSparks.material.opacity <= 0.05) {
      if (arcFlashSparks.parent) arcFlashSparks.parent.remove(arcFlashSparks);
      arcFlashSparks = null;
    }
  }
}

function applyThermalVisionToScene(active) {
  const currentScene = window.curThreeScene || (window.activeAIProceduralScene ? window.activeAIProceduralScene.sc : null);
  if (!currentScene) return;

  if (active) {
    currentScene.traverse(child => {
      if (child.isMesh && child.material && child.material.color) {
        if (!origSceneColors.has(child)) {
          origSceneColors.set(child, {
            color: child.material.color.getHex(),
            emissive: child.material.emissive ? child.material.emissive.getHex() : 0,
            roughness: child.material.roughness
          });
        }
        
        // Heat signature determination
        const id = child.userData ? child.userData.id : '';
        const isLiveBreaker = (id === 'b3' || id === 'panel' || id === 'main_unit') && (!st || !st.iso);
        const isSafeBreaker = (id === 'b3' || id === 'panel' || id === 'main_unit') && (st && st.iso);

        if (isLiveBreaker) {
          // Hot Red-Orange (88°C - 110°C)
          child.material.color.setHex(0xff2200);
          if (child.material.emissive) child.material.emissive.setHex(0xff5500);
        } else if (isSafeBreaker) {
          // Cool Cyan-Blue Safe State (21°C Ambient)
          child.material.color.setHex(0x00d9ff);
          if (child.material.emissive) child.material.emissive.setHex(0x003366);
        } else {
          // Cold environmental surfaces (Slate / Dark Indigo)
          child.material.color.setHex(0x131a2b);
          if (child.material.emissive) child.material.emissive.setHex(0x05070e);
        }
      }
    });
  } else {
    // Restore original colors
    origSceneColors.forEach((val, mesh) => {
      if (mesh && mesh.material) {
        mesh.material.color.setHex(val.color);
        if (mesh.material.emissive) mesh.material.emissive.setHex(val.emissive);
      }
    });
    origSceneColors.clear();
  }
}

// Tick function to animate smooth thermal cool-down transition from red to blue upon lockout
function updateThermalVisionTick(dt) {
  if (!window.thermalVisionActive) return;
  const readout = document.getElementById('thermal-readout');
  const isIsolated = st && st.iso;

  if (isIsolated) {
    if (readout) {
      readout.textContent = 'TARGET: 21.2°C [DE-ENERGIZED / SAFE]';
      readout.style.borderColor = '#00e5ff';
      readout.style.color = '#00e5ff';
    }
    // Dynamically lerp B3 breaker color towards icy blue
    const currentScene = window.curThreeScene || (window.activeAIProceduralScene ? window.activeAIProceduralScene.sc : null);
    if (currentScene) {
      currentScene.traverse(child => {
        if (child.userData && (child.userData.id === 'b3' || child.userData.id === 'panel')) {
          if (child.material && child.material.color) {
            child.material.color.lerp(new THREE.Color(0x00d9ff), dt * 3.0);
            if (child.material.emissive) child.material.emissive.lerp(new THREE.Color(0x003366), dt * 3.0);
          }
        }
      });
    }
  } else {
    if (readout) {
      readout.textContent = 'TARGET: 88.4°C [LIVE / ENERGIZED HAZARD]';
      readout.style.borderColor = '#ff2200';
      readout.style.color = '#ff4422';
    }
  }
}

window.createHolographicHUD = function(scene, pos) {
  if (!window.THREE || !scene) return null;
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 280;
  const ctx = canvas.getContext('2d');

  function renderHoloHUD() {
    ctx.clearRect(0, 0, 512, 280);
    // Sci-fi glass backdrop
    ctx.fillStyle = 'rgba(8, 20, 36, 0.88)';
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(8, 8, 496, 264, 16) : ctx.rect(8, 8, 496, 264);
    ctx.fill();
    ctx.strokeStyle = '#00e5ff';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Corner brackets
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(24, 12); ctx.lineTo(12, 12); ctx.lineTo(12, 24);
    ctx.moveTo(488, 12); ctx.lineTo(500, 12); ctx.lineTo(500, 24);
    ctx.moveTo(12, 256); ctx.lineTo(12, 268); ctx.lineTo(24, 268);
    ctx.moveTo(500, 256); ctx.lineTo(500, 268); ctx.lineTo(488, 268);
    ctx.stroke();

    // Header
    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 22px monospace';
    ctx.fillText('⚡ LIVE TELEMETRY & LOTO MONITOR', 24, 46);

    // Grid divider
    ctx.strokeStyle = '#38bdf844';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(24, 60); ctx.lineTo(488, 60); ctx.stroke();

    const isIso = st && st.iso;
    const isVer = st && st.ver;
    const isLocked = st && st.lock;

    // Line 1: Voltage
    ctx.fillStyle = '#94a3b8'; ctx.font = '16px monospace';
    ctx.fillText('BUS VOLTAGE:', 24, 102);
    ctx.fillStyle = isIso ? '#22c55e' : '#ef4444';
    ctx.font = 'bold 26px monospace';
    ctx.fillText(isIso ? '0.0 V AC [VERIFIED DEAD]' : '480.0 V AC [DANGER LIVE]', 180, 102);

    // Line 2: Air quality / Gas PPM
    ctx.fillStyle = '#94a3b8'; ctx.font = '16px monospace';
    ctx.fillText('GAS FUMES / PPM:', 24, 150);
    const ventOn = (MOD === 'w' && st && st.vent);
    ctx.fillStyle = ventOn ? '#22c55e' : (MOD === 'w' ? '#f59e0b' : '#38bdf8');
    ctx.font = 'bold 22px monospace';
    ctx.fillText(ventOn ? '8 PPM VOC [VENTILATED]' : (MOD === 'w' ? '185 PPM [VENT OFF]' : '12 PPM [NOMINAL]'), 200, 150);

    // Line 3: Temperature
    ctx.fillStyle = '#94a3b8'; ctx.font = '16px monospace';
    ctx.fillText('CORE TEMP:', 24, 196);
    ctx.fillStyle = isIso ? '#00e5ff' : '#f97316';
    ctx.font = 'bold 22px monospace';
    ctx.fillText(isIso ? '21.5°C [AMBIENT COOL]' : '84.2°C [ELEVATED HEAT]', 180, 196);

    // Line 4: LOTO Isolation Status
    ctx.fillStyle = '#94a3b8'; ctx.font = '16px monospace';
    ctx.fillText('LOTO LOCK:', 24, 244);
    ctx.fillStyle = isLocked ? '#22c55e' : (isIso ? '#f59e0b' : '#ef4444');
    ctx.font = 'bold 20px monospace';
    ctx.fillText(isLocked ? 'APPLIED & VERIFIED 🔒' : (isIso ? 'OPEN / LOCKOUT PENDING ⚠️' : 'UNLOCKED / ENERGIZED ⛔'), 180, 244);
  }

  renderHoloHUD();
  const texture = new THREE.CanvasTexture(canvas);
  texture.minFilter = THREE.LinearFilter;
  const mat = new THREE.MeshBasicMaterial({
    map: texture,
    transparent: true,
    opacity: 0.95,
    side: THREE.DoubleSide
  });
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.3), mat);
  pos = pos || { x: 1.8, y: 2.1, z: -7.0 };
  plane.position.set(pos.x, pos.y, pos.z);
  plane.userData = { isHoloHUD: true, y0: pos.y, canvas, renderHoloHUD, texture };
  scene.add(plane);
  return plane;
};

function handleHazardPhotoFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const rawData = e.target.result;
    // Downscale large camera photos on off-screen canvas to max 1280px to guarantee fast upload and fit API limits
    const img = new Image();
    img.onload = () => {
      const maxDim = 1280;
      let w = img.width;
      let h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w > h) {
          h = Math.round((h * maxDim) / w);
          w = maxDim;
        } else {
          w = Math.round((w * maxDim) / h);
          h = maxDim;
        }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const optimizedDataUrl = canvas.toDataURL('image/jpeg', 0.85);

      window._currentPhotoBase64 = optimizedDataUrl;
      window._selectedPhotoPreset = null;
      window._currentHazardAnalysis = null;

      const previewImg = document.getElementById('photo-preview-img');
      const wrap = document.getElementById('photo-preview-wrap');
      const dropCont = document.getElementById('dropzone-content');
      if (previewImg && wrap) {
        previewImg.src = optimizedDataUrl;
        wrap.style.display = 'block';
        if (dropCont) dropCont.style.display = 'none';
      }
    };
    img.src = rawData;
  };
  reader.readAsDataURL(file);
}

async function runVisionHazardAnalysis() {
  if (!window._currentPhotoBase64 && !window._selectedPhotoPreset) {
    alert('Please upload a workplace photo or select an industrial preset first.');
    return;

  const scanLine = document.getElementById('photo-scanner-line');

  if (btn) { btn.disabled = true; btn.textContent = '🧠 Vision AI Scanning Exact Photo...'; }

  const apiKey = getGroqKey ? getGroqKey() : '';
  let analysis = null;

  // Real forensic AI analysis of the uploaded photo
  if (apiKey && window._currentPhotoBase64 && window._currentPhotoBase64.startsWith('data:image/') && !window._selectedPhotoPreset) {
    try {
      const forensicPrompt = `You are a certified senior OSHA & NFPA Workplace Safety Inspector and 3D Simulation Engineer.
Analyze the uploaded workplace photo in thorough, forensic detail. Identify the EXACT physical hazards, unsafe conditions, missing PPE, and compliance violations present in the photo.

CRITICAL INSTRUCTIONS:
1. Examine the ACTUAL objects, equipment, signage, markings, wires, fluids, and personnel in the image.
2. Formulate specific, tailored hazard findings based directly on what is visible in the photo.
3. For each hazard, specify exact OSHA standard codes (e.g. 29 CFR 1910.303, 29 CFR 1910.22, 29 CFR 1910.132, NFPA 70E, etc.), explain precisely what is unsafe and the injury risk, and provide required mitigation steps.
4. Generate a rich, descriptive 'scenarioPrompt' suitable for generating an interactive 3D training simulation of this exact environment.

Return ONLY a valid JSON object matching this schema:
{
  "workplace": "Descriptive title of the workplace setting in the photo",
  "hazards": [
    {
      "id": "h1",
      "title": "Exact Hazard Title",
      "sev": "crit",
      "osha": "OSHA / NFPA standard code",
      "why": "Detailed explanation of what is visibly unsafe and the risk of injury",
      "mit": "Concrete engineering or procedural mitigation"
    }
  ],
  "scenarioPrompt": "Comprehensive prompt for 3D simulator containing the machines, hazards, and mitigation objects seen in the photo."
}`;

      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + apiKey
        },
        body: JSON.stringify({
          model: 'qwen/qwen3.8-27b',
          messages: [
            {
              role: 'user',
              content: [
                { type: 'text', text: forensicPrompt },
                { type: 'image_url', image_url: { url: window._currentPhotoBase64 } }
              ]
            }
          ],
          temperature: 0.1,
          response_format: { type: 'json_object' }
        })
      });

      if (res.ok) {
        const data = await res.json();
        const raw = data.choices[0].message.content.replace(/```json/gi, '').replace(/```/g, '').trim();
        analysis = JSON.parse(raw);
      } else {
        const errText = await res.text();
        console.error('Vision API response error:', res.status, errText);
      }
    } catch(e) {
      console.warn('Vision API exception:', e);
    }
  }

  // Handle Presets or notify on failed photo analysis
  if (!analysis) {
    if (window._selectedPhotoPreset) {
      await new Promise(r => setTimeout(r, 600));
      analysis = {
        workplace: window._selectedPhotoPreset.name,
        hazards: window._selectedPhotoPreset.hazards,
        scenarioPrompt: window._selectedPhotoPreset.prompt
      };
    } else {
      if (scanLine) scanLine.classList.remove('scanning');
      if (btn) { btn.disabled = false; btn.textContent = '🔍 Run AI Vision Hazard Audit'; }
      alert('Unable to complete AI Vision analysis on this image. Please ensure your network connection is active or test the API configuration.');
      return;
    }
  }

  if (scanLine) scanLine.classList.remove('scanning');
  if (btn) { btn.disabled = false; btn.textContent = '🔍 Run AI Vision Hazard Audit'; }

  window._currentHazardAnalysis = analysis;

function localFallbackCoach(q, o, curStep){
  const x = (q||'').toLowerCase();
  if(/next|hint|what now|stuck|help/.test(x)) {
    if(curStep >= 0){
      return "You are on Step " + (curStep + 1) + ": " + o.steps[curStep] + ". " + o.tips[curStep] + " Please perform this step carefully so the work area remains completely safe.";
    }
    return "All steps in this procedure have been completed successfully. You can now inspect your work area or begin the emergency drill.";
  }
  if(/why|reason/.test(x)) {
    return "In high-voltage electrical work, every step follows a strict order to protect your life. If you skip isolation or testing, live electricity can cause a severe shock or an explosive arc flash reaching thousands of degrees.";
  }
  if(/loto|lock|padlock|tag/.test(x)){
    return "Lockout Tagout means putting your personal padlock and a red danger tag on breaker B3. This physically prevents anyone else from turning the power back on while your hands are inside the panel.";
  }
  if(/arc|flash|burn/.test(x)){
    return "An arc flash is a violent electrical explosion caused by a short circuit. It produces blinding light, high heat, and molten metal splatter. Confirming zero voltage with your tester protects you from this danger.";
  }
  if(/ppe|glove|helmet|goggle/.test(x)){
    return "Always wear your safety helmet, goggles, and insulated rubber gloves before touching equipment. The helmet protects from falling objects, goggles shield your eyes from sparks, and insulated gloves prevent electric current from flowing through your body.";
  }
  if(/volt|multimeter|tester|probe/.test(x)){
    return "Always test before you touch. Use the voltage tester on line 3 to confirm the reading is zero volts. Only when zero volts is verified is it truly safe to use tools on the panel.";
  }
  if(/breaker|b3|b1|b2/.test(x)){
    return "The work order specifies Line 3, which is controlled by breaker B3. Turning off breaker B3 cuts the electrical current to that specific line so you can safely perform maintenance without shocking yourself.";
  }
  const m = o.kb && o.kb.find(k => k[0].test(x));
  return m ? m[1] : "Follow the safe vocational procedure: first put on full safety gear, switch off breaker B3, verify zero volts with the tester, and then complete the maintenance safely.";
}

async function queryGroqSafetyCoach(userQuery, o, curStep){
  const apiKey = getGroqKey();
  if(!apiKey){
    return localFallbackCoach(userQuery, o, curStep);
  }
  const langText = (typeof LANG !== 'undefined' && LANG === 'ta') ? 'pure Tamil (தமிழ்)' : ((typeof LANG !== 'undefined' && LANG === 'hi') ? 'pure Hindi (हिन्दी)' : 'concise English');
  const curName = o && o.name ? o.name : 'workshop';
  const curStepTitle = (curStep >= 0 && o && o.steps && o.steps[curStep]) ? o.steps[curStep] : 'General Safety';
  const curTip = (curStep >= 0 && o && o.tips && o.tips[curStep]) ? o.tips[curStep] : '';
  const sysPrompt = `You are SafeBot, a patient, warm, and highly experienced senior vocational instructor training Indian ITI and technical students (Ministry of Skill Development and Entrepreneurship / NSDC).

CRITICAL INSTRUCTIONS FOR REAL-TIME SITUATIONAL COACHING:
1. CURRENT SITUATION IN VR WORKSHOP:
   - Module: ${curName}.
   - Active Step: Step ${curStep >= 0 ? curStep + 1 : 'Completed'}: ${curStepTitle}.
   - Procedure context: ${curTip}.
2. EXPLAIN PROPERLY ACCORDING TO SITUATION:
   - Understand the trainee's question and current situation in the workshop.
   - Clearly explain WHAT action to perform right now.
   - Clearly explain in simple terms WHY it is dangerous and how this action protects the human body from harm (shock, burns, arc flash, toxic gas).
   - Tell the student the exact tool or equipment to interact with next.
3. LANGUAGE & CLARITY:
   - Absolutely no slang, no dense jargon. Calm, polite, encouraging tone.
   - Reply in ${langText}.
4. LENGTH: Exactly 2 to 3 calm, clear sentences (around 35-50 words).`;

  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + apiKey
      },
      body: JSON.stringify({
        model: 'qwen/qwen3.8-27b',
        messages: [
          { role: 'system', content: sysPrompt },
          { role: 'user', content: userQuery }
        ],
        temperature: 0.2,
        max_tokens: 250
      })
    });
    if(!res.ok) return localFallbackCoach(userQuery, o, curStep);
    const data = await res.json();
    
    if(data.choices && data.choices[0] && data.choices[0].message){
      const m = data.choices[0].message;
      const ans = (m.content || m.reasoning || '').trim();
      if(ans) return ans;
    }
    return localFallbackCoach(userQuery, o, curStep);

  } catch(e) {
    return localFallbackCoach(userQuery, o, curStep);
  }
}

  recognition.start();
}

// Override say() to support unicode and multilingual speech synthesis
// Phonetic cleaner to expand technical abbreviations so speech sounds clear and natural
function cleanSpeechText(text, lang) {
  if (!text) return '';
  let s = String(text).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
  // Strip emojis and visual marker symbols
  s = s.replace(/[⚡🔥🪖🥽🧤🛑🔍🔁🔧🔨🛠️⚠️🚨✅▶️○📌]/g, '');
  if (lang === 'en' || !lang) {
    s = s.replace(/\bPPE\b/gi, 'P.P.E. safety equipment')
         .replace(/\bLOTO\b/gi, 'Lockout Tagout safety lock')
         .replace(/\bB3\b/gi, 'Breaker B-3')
         .replace(/\bB1\b/gi, 'Breaker B-1')
         .replace(/\bB2\b/gi, 'Breaker B-2')
         .replace(/\bB4\b/gi, 'Breaker B-4')
         .replace(/\b0\s*V\b/gi, 'zero volts')
         .replace(/\b11\s*kV\b/gi, '11 kilo-volts')
         .replace(/\bVDE\b/gi, 'insulated electrical')
         .replace(/\bIS\s*5216\b/gi, 'Indian Standard 5216')
         .replace(/\bE-stop\b/gi, 'Emergency stop button');
  }
  return s.trim();
}

// Find the best, clearest human voice available on the device
function getBestVoice(lang) {
  if (!window.speechSynthesis) return null;
  const voices = speechSynthesis.getVoices();
  if (!voices || !voices.length) return null;
  
  if (lang === 'ta') {
    return voices.find(v => v.lang.includes('ta') || v.name.toLowerCase().includes('tamil')) || null;
  }
  if (lang === 'hi') {
    return voices.find(v => v.lang.includes('hi') || v.name.toLowerCase().includes('hindi') || v.name.includes('Kalpana') || v.name.includes('Hemant')) || null;
  }
  const preferred = voices.find(v => (v.lang === 'en-IN' && !v.name.includes('eSpeak')) || v.name.includes('Heera') || v.name.includes('Ravi') || v.name.includes('Google UK English Female') || v.name.includes('Natural'));
  return preferred || voices.find(v => v.lang.startsWith('en')) || voices[0];
}

say = function(t, f, forceLang){
  try {
    if(!VO || !window.speechSynthesis || !t) return;
    const l = forceLang || LANG || 'en';

};

// Normalizes LLM JSON output to guarantee a valid, crash-proof 3D specification
function normalizeWorldSpec(rawSpec, promptText) {
  let spec = typeof rawSpec === 'string' ? JSON.parse(rawSpec) : rawSpec;
  spec.title = spec.title || promptText.slice(0, 45) || 'Custom Vocational Safety Simulation';
  spec.theme = spec.theme || 'industrial';
  spec.particleEffect = spec.particleEffect || 'none';
  
  if (!Array.isArray(spec.objects) || spec.objects.length === 0) {
    spec.objects = [
      { id: "main_unit", type: "machine", x: 0, y: 1.0, z: -4, label: "Primary Equipment" },
      { id: "safety_ppe", type: "ppe", x: -2.5, y: 0.8, z: -2, label: "PPE Station" },
      { id: "estop_unit", type: "estop", x: 2.5, y: 1.0, z: -2, label: "Emergency Stop" }
    ];
  } else {
    spec.objects = spec.objects.map((obj, i) => {
      if (typeof obj === 'string') {
        const spreadX = ((i % 5) - 2) * 1.8;
        const spreadZ = -3.0 - Math.floor(i / 5) * 1.8;
        return {
          id: 'obj_' + i,
          type: guessObjectType(obj),
          x: spreadX,
          y: 1.0,
          z: spreadZ,
          label: obj
        };
      }
      return {
        id: obj.id || ('obj_' + i),
        type: obj.type || guessObjectType(obj.label || ''),
        x: typeof obj.x === 'number' ? obj.x : (((i % 5) - 2) * 1.8),
        y: typeof obj.y === 'number' ? obj.y : 1.0,
        z: typeof obj.z === 'number' ? obj.z : (-3.0 - Math.floor(i / 5) * 1.5),
        label: obj.label || obj.id || ('Station ' + (i+1)),
        desc: obj.desc || ''
      };
    });
  }

  if (!Array.isArray(spec.steps) || spec.steps.length === 0) {
    spec.steps = [
      { instruction: "Equip appropriate personal protective equipment (PPE)", targetId: spec.objects[0].id },
      { instruction: "Verify zero energy state and inspect operating perimeter", targetId: spec.objects[Math.min(1, spec.objects.length-1)].id },
      { instruction: "Neutralize active hazards on the target equipment", targetId: spec.objects[spec.objects.length-1].id }
    ];
  } else {
    spec.steps = spec.steps.map((st, i) => {
      if (typeof st === 'string') {
        const tgt = spec.objects[i % spec.objects.length]?.id || spec.objects[0].id;
        return { instruction: st, targetId: tgt };
      }
      return {
        instruction: st.instruction || st.action || 'Perform safety inspection',
        targetId: st.targetId || spec.objects[i % spec.objects.length]?.id || spec.objects[0].id
      };
    });
  }

  if (!Array.isArray(spec.hazards) || spec.hazards.length === 0) {
    spec.hazards = ["Risk of personal injury from unverified safety protocols", "Workplace equipment hazard exposure"];
  }

  return spec;
}

function guessObjectType(name) {
  const n = (name || '').toLowerCase();
  if (n.includes('cable') || n.includes('cord') || n.includes('wire') || n.includes('trip')) return 'cable';
  if (n.includes('car') || n.includes('truck') || n.includes('vehicle')) return 'car';
  if (n.includes('lift') || n.includes('hoist') || n.includes('jack')) return 'lift';
  if (n.includes('solar') || n.includes('pv') || n.includes('inverter')) return 'solar';
  if (n.includes('boiler') || n.includes('furnace') || n.includes('heater')) return 'boiler';
  if (n.includes('tank') || n.includes('vessel') || n.includes('reactor')) return 'tank';
  if (n.includes('valve') || n.includes('switch') || n.includes('breaker')) return 'valve';
  if (n.includes('pipe') || n.includes('conduit') || n.includes('duct')) return 'pipe';
  if (n.includes('panel') || n.includes('cabinet') || n.includes('gauge') || n.includes('box')) return 'panel';
  if (n.includes('ppe') || n.includes('goggle') || n.includes('helmet') || n.includes('shield') || n.includes('glove') || n.includes('harness')) return 'ppe';
  if (n.includes('stop') || n.includes('button') || n.includes('trip') || n.includes('estop')) return 'estop';
  if (n.includes('scaffold') || n.includes('stage')) return 'scaffold';
  if (n.includes('ladder')) return 'ladder';
  if (n.includes('spill') || n.includes('leak') || n.includes('puddle') || n.includes('fluid') || n.includes('oil') || n.includes('acid')) return 'spill';
  if (n.includes('extinguisher') || n.includes('fire')) return 'extinguisher';
  if (n.includes('drum') || n.includes('barrel') || n.includes('cylinder') || n.includes('bottle')) return 'drum';
  if (n.includes('motor') || n.includes('engine') || n.includes('pump') || n.includes('generator')) return 'motor';
  if (n.includes('lathe') || n.includes('cnc') || n.includes('milling') || n.includes('machine')) return 'machine';
  if (n.includes('cone') || n.includes('barrier') || n.includes('fence')) return 'cone';
  return 'generic';
}

// Comprehensive Vocational 3D Scenario Architect (12 to 16 Co-located Industrial Assets)
function buildComprehensiveTrainingWorldSpec(promptText, hazardData) {
  const p = (promptText || '').trim();
  const ha = hazardData || window._pendingHazardWorldSpec || window._currentHazardAnalysis;

  // Determine domain theme
  let theme = 'electrical';
  let particle = 'none';
  if (/boiler|steam|furnace|heater|pressure/i.test(p) || (ha && /boiler|steam/i.test(ha.workplace || ''))) {
    theme = 'boiler'; particle = 'steam';
  } else if (/chemical|acid|toxic|drum|solvent|leak|spill/i.test(p) || (ha && /chemical|drum|solvent/i.test(ha.workplace || ''))) {
    theme = 'chemical'; particle = 'smoke';
  } else if (/scaffold|height|ladder|fall|staging/i.test(p) || (ha && /scaffold|fall|height/i.test(ha.workplace || ''))) {
    theme = 'construction'; particle = 'none';
  } else if (/welding|arc|fume|hot work/i.test(p) || (ha && /weld/i.test(ha.workplace || ''))) {
    theme = 'electrical'; particle = 'sparks';
  } else if (/automotive|car|engine|lift|vehicle/i.test(p) || (ha && /auto|vehicle/i.test(ha.workplace || ''))) {
    theme = 'automotive'; particle = 'smoke';
  } else if (/electric|volt|switchgear|breaker|cable|power|panel/i.test(p)) {
    theme = 'electrical'; particle = 'sparks';
  }

  const objects = [];
  const add = (id, type, label, x, y, z) => {
    if (!objects.some(o => o.id === id)) {
      objects.push({ id, type, label, x, y, z });
    }
  };

  // 1. PRIMARY INDUSTRIAL WORKSTATION (center-stage, z = -3.8)
  if (theme === 'electrical') {
    add('main_switchgear', 'panel', '480V Industrial Switchgear & Disconnect', 0, 1.0, -3.8);
    add('trailing_cable', 'cable', 'Unguarded 480V Trailing Cable (Trip Hazard)', 0.4, 0.04, -2.2);

    add('chemical_spill', 'spill', 'Corrosive Solvent Puddle Spill', 0.4, 0.03, -2.4);
  } else if (theme === 'construction') {
    add('scaffold_tower', 'scaffold', '4.5m Modular Work Scaffolding (Unguarded)', 0, 0.8, -3.8);
    add('access_ladder', 'ladder', 'Unsecured Access Safety Ladder', -1.6, 1.0, -3.2);
  } else if (theme === 'boiler') {
    add('high_press_boiler', 'boiler', 'High-Pressure Steam Boiler Vessel', 0, 1.4, -3.8);
    add('steam_valve', 'valve', 'Manual Pressure Relief Valve', 1.4, 1.3, -3.4);
    add('discharge_pipe', 'pipe', 'Pressurized Steam Discharge Line', 0, 2.6, -3.6);

    add('vehicle_chassis', 'car', 'Automotive Vehicle Chassis', 0, 0.4, -3.8);
    add('hydraulic_lift', 'lift', 'Two-Post Hydraulic Vehicle Lift', 0, 0.5, -3.8);
    add('oil_spill', 'spill', 'Engine Oil Puddle on Walkway', 0.2, 0.03, -2.2);
  } else {
    add('cnc_station', 'machine', 'Heavy Industrial CNC Workstation', 0, 1.0, -3.8);
  }

  // 2. ADDITIONAL CO-LOCATED HAZARDS FROM PHOTO / AUDIT
  if (ha && Array.isArray(ha.hazards)) {
    ha.hazards.forEach((h, idx) => {
      const hTitle = (h.title || '').toLowerCase();
      if ((hTitle.includes('cable') || hTitle.includes('trip') || hTitle.includes('wire')) && !objects.some(o => o.type === 'cable')) {
        add('trip_hazard_cable', 'cable', 'Exposed High-Voltage Cable (OSHA ' + (h.osha || '1910.303') + ')', 0.6, 0.04, -2.0);
      }
      if ((hTitle.includes('spill') || hTitle.includes('slip') || hTitle.includes('leak') || hTitle.includes('liquid')) && !objects.some(o => o.type === 'spill')) {
        add('floor_spill_slick', 'spill', 'Hazardous Liquid Puddle (OSHA ' + (h.osha || '1910.22') + ')', -0.5, 0.03, -2.4);
      }
    });
  }

  // 3. ESSENTIAL INDUSTRIAL SAFETY & REMEDIATION ASSETS (FULL COMPREHENSIVE BAY)
  // LOTO Safety Station
  add('loto_station', 'loto', 'OSHA Lockout/Tagout (LOTO) Station', -3.2, 1.2, -3.8);
  // Heavy floor cord protector ramp
  add('cable_ramp', 'ramp', 'Heavy-Duty Rubber Cable Protector Ramp', 2.2, 0.04, -1.8);
  // Barricade Safety Cones
  add('cone_left', 'cone', 'Safety Barricade Warning Cone (North)', -1.8, 0.3, -1.8);
  add('cone_right', 'cone', 'Safety Barricade Warning Cone (South)', 1.8, 0.3, -1.8);
  // PPE Tool Bench & Safety Gear
  add('ppe_workbench', 'table', 'Safety Tool Bench', -3.2, 0.5, -1.6);
  add('ppe_gear_station', 'ppe', 'Mandatory PPE (1000V Dielectric Gloves & Shield)', -3.2, 0.95, -1.6);
  // Spill Containment Kit Drum
  add('spill_kit_drum', 'drum', 'OSHA Spill Response Kit Drum', 3.2, 0.5, -2.6);
  // Fire Extinguisher
  add('fire_extinguisher', 'extinguisher', 'ABC Dry Chemical Fire Extinguisher', 3.6, 0.8, -3.8);
  // Industrial Tool Chest
  add('tool_chest', 'toolchest', 'Heavy 5-Drawer Industrial Tool Cabinet', -2.8, 0.5, 0.2);
  // Industrial Pallet Shelving Rack
  add('parts_rack', 'rack', 'Industrial Component Storage Rack', 3.2, 1.1, 0.4);
  // Safety Perimeter Bollards
  add('bollard_1', 'bollard', 'High-Visibility Steel Guard Bollard', -2.4, 0.5, -0.8);
  add('bollard_2', 'bollard', 'High-Visibility Steel Guard Bollard', 2.4, 0.5, -0.8);
  // Emergency Stop E-Stop Pushbutton
  add('emergency_stop', 'estop', 'Emergency Power Cutoff (E-Stop)', 2.5, 0.9, -3.5);

  // 4. STRUCTURED REMEDIATION STEPS
  const steps = [
    { instruction: 'Equip required Personal Protective Equipment (PPE) from the safety bench.', targetId: 'ppe_gear_station' },
    { instruction: 'Retrieve Lockout/Tagout padlocks from LOTO station and isolate primary energy.', targetId: 'loto_station' },
    { instruction: 'Deploy heavy rubber cable protector ramp across the exposed power line.', targetId: 'cable_ramp' },
    { instruction: 'Erect safety barricade warning cones around the hazard perimeter.', targetId: 'cone_left' }
  ];

  if (theme === 'electrical') {
    steps.push({ instruction: 'Verify zero voltage on 480V switchgear using calibrated CAT IV tester.', targetId: 'main_switchgear' });
  } else if (theme === 'chemical') {
    steps.push({ instruction: 'Deploy absorbent neutralizing boom from spill kit drum to contain liquid.', targetId: 'spill_kit_drum' });
  } else if (theme === 'construction') {
    steps.push({ instruction: 'Inspect and secure access ladder footing before mounting work platform.', targetId: 'access_ladder' });
  } else if (theme === 'boiler') {
    steps.push({ instruction: 'Safely vent pressure line via manual relief valve to zero PSI.', targetId: 'steam_valve' });
  } else {
    steps.push({ instruction: 'Verify equipment emergency stop control and log safety inspection.', targetId: 'emergency_stop' });
  }

  // 5. EXTRACT AUDIT HAZARDS
  let hazards = [
    'Unverified equipment state posing severe electrocution, mechanical, or contact danger',
    'Tripping and electrical contact hazard from trailing floor cables',
    'Failure to follow OSHA / NFPA standard zero-energy isolation procedures'
  ];
  if (ha && Array.isArray(ha.hazards) && ha.hazards.length > 0) {
    hazards = ha.hazards.map(h => `${h.title} [${h.osha || 'OSHA Standard'}]: ${h.why}`);
  }

  let title = (ha && ha.workplace) ? `${ha.workplace} Safety Bay` : (p.length > 45 ? p.slice(0, 42) + '...' : (p || 'Industrial Safety Simulation'));
  title = title.charAt(0).toUpperCase() + title.slice(1);

  return {
    title,
    theme,
    particleEffect: particle,
    objects,
    steps,
    hazards
  };
}

async function generateAndLaunch3DWorld(){
  const promptText = (document.getElementById('ai3d-prompt')?.value || '').trim();
  if(!promptText && !window._pendingHazardWorldSpec){
    alert('Please enter a scenario description or select one of the presets or example chips above.');
    return;
  }
  
  const pBox = document.getElementById('ai3d-progress-box');
  const pStep = document.getElementById('ai3d-progress-step');
  const pPct = document.getElementById('ai3d-progress-pct');
  const pBar = document.getElementById('ai3d-progress-bar');
  const st = document.getElementById('ai3d-status');
  const btn = document.getElementById('ai3d-gen-btn');
  
  const setProgress = (stepText, pct) => {
    if(pBox) pBox.style.display = 'block';
    if(pStep) pStep.textContent = stepText;
    if(pPct) pPct.textContent = pct + '%';
    if(pBar) pBar.style.width = pct + '%';
    if(st) st.textContent = stepText;
  };
  
  if(btn) btn.disabled = true;
  setProgress('🧠 Step 1/4: Neural Spatial Engine compiling high-detail industrial scenario...', 25);
  
  const apiKey = getGroqKey();
  let worldSpec = null;
  
  // If user selected an institutional preset without modifying text
  if(window._selectedPresetSpec && promptText.includes(window._selectedPresetSpec.title.slice(0, 10))){
    worldSpec = window._selectedPresetSpec;
  }
  
  if(!worldSpec && apiKey && promptText){
    try {
      const sys_prompt = `You are a 3D VR procedural world architect for high-detail industrial safety training.
Convert the user scenario into valid JSON (and ONLY JSON, no markdown, no other text) with this schema:
{
  "title": "Short Scenario Title",
  "theme": "boiler, chemical, electrical, construction, automotive, or solar",
  "particleEffect": "steam, sparks, smoke, or none",
  "objects": [
    {"id": "obj1", "type": "car, lift, boiler, tank, valve, pipe, panel, table, ppe, estop, scaffold, spill, cable, solar, extinguisher, drum, motor, machine, loto, ramp, toolchest, rack, bollard, or ladder", "x": 0, "y": 1.0, "z": -4, "label": "Display Name"}
  ],
  "steps": [
    {"instruction": "Clear plain instruction", "targetId": "obj1"}
  ],
  "hazards": ["Hazard description"]
}`;
      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
        body: JSON.stringify({
          model: 'qwen/qwen3.8-27b',
          messages: [{ role: 'system', content: sys_prompt }, { role: 'user', content: promptText }],
          max_tokens: 850,
          response_format: { type: "json_object" }
        })
      });
      if(res.ok){
        const data = await res.json();
        const raw = data.choices[0].message.content;
        worldSpec = normalizeWorldSpec(raw, promptText);
      }
    } catch(e) {
      console.warn('AI 3D compilation error, using comprehensive fallback:', e);
    }
  }
  
  // High-Quality Comprehensive Synthesis (12 to 16 co-located assets)
  if(!worldSpec || !worldSpec.objects || worldSpec.objects.length < 8){
    worldSpec = buildComprehensiveTrainingWorldSpec(promptText, window._pendingHazardWorldSpec);
  }

  // Enrich with exact photo hazard items if launched from Photo-to-Hazards
  if (window._pendingHazardWorldSpec && window._pendingHazardWorldSpec.hazards) {
    const phHazards = window._pendingHazardWorldSpec.hazards;
    worldSpec.title = window._pendingHazardWorldSpec.workplace ? `${window._pendingHazardWorldSpec.workplace} Scenario` : worldSpec.title;
    worldSpec.hazards = phHazards.map(h => `${h.title} [${h.osha || 'OSHA'}]: ${h.why}`);
    window._pendingHazardWorldSpec = null;
  }
  
  setProgress('📐 Step 2/4: Generating architectural ceiling trusses, floor textures & spotlights...', 55);
  await new Promise(r => setTimeout(r, 200));
  
  setProgress('🧱 Step 3/4: Spawning interactive industrial equipment, LOTO cabinets & tools...', 85);
  await new Promise(r => setTimeout(r, 250));
  
  setProgress('🥽 Step 4/4: Initializing 3D VR simulation bay...', 100);
  await new Promise(r => setTimeout(r, 200));
  
  if(btn) btn.disabled = false;
  startAIProceduralSimulation(worldSpec);
}
window.generateCustomVRWorld = generateAndLaunch3DWorld;

// Procedural 3D World Simulation Runner with Expanded Geometry Palette
function startAIProceduralSimulation(spec){
  go('sim');
  const cv = document.getElementById('cv');
  const sw = document.getElementById('sw');
  if(!cv || !sw) return;
  
  const R = new THREE.WebGLRenderer({canvas: cv, antialias: true});
  R.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  R.shadowMap.enabled = true;
  R.xr.enabled = true;
  
  const sc = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(70, 1, 0.1, 60);
  window.curThreeScene = sc;
  window.activeAIProceduralScene = { sc, cam, R };
  if(typeof createHolographicHUD === 'function') {
    window._holoHUD = createHolographicHUD(sc, { x: 0, y: 2.2, z: -3.6 });
  }
  const objs = [];
  const me = sim = { run: true, objs, R };
  
  const M = (c, o) => new THREE.MeshStandardMaterial(Object.assign({color: c, roughness: .6, metalness: .2}, o||{}));
  const Bc = c => new THREE.MeshBasicMaterial({color: c});
  
  // Theme styling & Lighting
  const themeColors = {
    boiler: { bg: 0x0f1722, fog: 0x0f1722, floor: 0x334155, wall: 0x1e293b },
    chemical: { bg: 0x0a141b, fog: 0x0a141b, floor: 0x223544, wall: 0x182a38 },
    electrical: { bg: 0x0d1520, fog: 0x0d1520, floor: 0x2b3846, wall: 0x1a2530 },
    construction: { bg: 0x141f2c, fog: 0x141f2c, floor: 0x3d4b58, wall: 0x273644 },
    automotive: { bg: 0x111827, fog: 0x111827, floor: 0x2e3846, wall: 0x1f2937 },
    solar: { bg: 0x0b1726, fog: 0x0b1726, floor: 0x3b4252, wall: 0x242c3d }
  };
  const th = themeColors[spec.theme] || themeColors.boiler;
  sc.background = new THREE.Color(th.bg);
  sc.fog = new THREE.Fog(th.fog, 18, 45);
  
  sc.add(new THREE.HemisphereLight(0xffffff, 0x445566, 0.7));
  const dl = new THREE.DirectionalLight(0xfff3d9, 0.6);
  dl.position.set(4, 9, 5);
  dl.castShadow = true;
  sc.add(dl);
  
  // Procedural Industrial Floor Texture Generator
  function createIndustrialFloorTexture(themeKey) {
    const c = document.createElement('canvas');
    c.width = 1024; c.height = 1024;
    const ctx = c.getContext('2d');

    // Concrete base color
    ctx.fillStyle = (themeKey === 'chemical') ? '#1e2836' : ((themeKey === 'electrical') ? '#1c2430' : '#222d3d');
    ctx.fillRect(0, 0, 1024, 1024);

    // Concrete Expansion Joint Slabs
    ctx.strokeStyle = 'rgba(10, 15, 25, 0.7)';
    ctx.lineWidth = 4;
    for (let x = 0; x <= 1024; x += 128) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1024); ctx.stroke();
    }
    for (let y = 0; y <= 1024; y += 128) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1024, y); ctx.stroke();
    }

    // Concrete texture speckling
    ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
    for (let i = 0; i < 900; i++) {
      ctx.fillRect(Math.random() * 1024, Math.random() * 1024, 2, 2);
    }

    // High-Visibility Safety Walkway Corridor (running north-south)
    ctx.fillStyle = 'rgba(234, 179, 8, 0.22)';
    ctx.fillRect(380, 500, 264, 524);
    ctx.strokeStyle = '#eab308';
    ctx.lineWidth = 10;
    ctx.strokeRect(380, 500, 264, 524);

    // Safety Walkway Directional Text
    ctx.fillStyle = '#fef08a';
    ctx.font = 'bold 22px monospace';
    ctx.textAlign = 'center';
    ctx.save();
    ctx.translate(512, 760);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText('SAFETY WALKWAY · KEEP CLEAR', 0, 0);
    ctx.restore();

    // Restricted Hazard Perimeter Zone (under center-stage hazard machines)
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 8;
    ctx.strokeRect(200, 100, 624, 360);

    // Red diagonal crosshatch inside hazard zone
    ctx.save();
    ctx.beginPath();
    ctx.rect(200, 100, 624, 360);
    ctx.clip();
    ctx.strokeStyle = 'rgba(239, 68, 68, 0.35)';
    ctx.lineWidth = 14;
    for (let d = -600; d < 1200; d += 60) {
      ctx.beginPath();
      ctx.moveTo(200 + d, 100);
      ctx.lineTo(200 + d + 360, 460);
      ctx.stroke();
    }
    ctx.restore();

    // Diagonal Yellow & Black Chevron hazard boundary line
    ctx.save();
    ctx.beginPath();
    ctx.rect(190, 85, 644, 25);
    ctx.clip();
    for (let c = 0; c < 700; c += 35) {
      ctx.fillStyle = (Math.floor(c / 35) % 2 === 0) ? '#eab308' : '#0f172a';
      ctx.beginPath();
      ctx.moveTo(190 + c, 85);
      ctx.lineTo(190 + c + 25, 85);
      ctx.lineTo(190 + c + 50, 110);
      ctx.lineTo(190 + c + 25, 110);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    ctx.fillStyle = '#fca5a5';
    ctx.font = 'bold 24px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('RESTRICTED HAZARD ZONE · PPE MANDATORY', 512, 140);

    const tex = new THREE.CanvasTexture(c);
    return tex;
  }

  // Floor & Enclosure Walls
  const flGeo = new THREE.PlaneGeometry(16, 16);

  const wMat = M(th.wall, {roughness: 0.9});
  [[-8, 2, 0, Math.PI/2], [8, 2, 0, -Math.PI/2], [0, 2, -8, 0], [0, 2, 8, Math.PI]].forEach(p => {
    const wm = new THREE.Mesh(new THREE.PlaneGeometry(16, 4.5), wMat);

    wm.rotation.y = p[3];

  });

  // Architectural Heavy Steel Ceiling Trusses
  const trussMat = M(0x334155, { metalness: 0.7, roughness: 0.4 });
  [-5, -1.5, 2, 5.5].forEach(tz => {
    const beam = new THREE.Mesh(new THREE.BoxGeometry(16, 0.22, 0.22), trussMat);
    beam.position.set(0, 4.3, tz);

    [-4, 0, 4].forEach(tx => {

  });

  // Hanging Industrial High-Bay Pendant Floodlights & Downlight Spotlights
  [[-3, -3], [3, -3], [-3, 3], [3, 3]].forEach(lp => {
    const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.9, 8), trussMat);
    rod.position.set(lp[0], 3.85, lp[1]);

    spot.target.position.set(lp[0], 0, lp[1]);
    sc.add(spot);
    sc.add(spot.target);

  // Focused Work Bay Spotlight directly over Primary Hazard Station
  const workSpot = new THREE.SpotLight(0x38bdf8, 1.3, 16, Math.PI / 3.5, 0.3, 1.0);
  workSpot.position.set(0, 4.2, -1.0);
  workSpot.target.position.set(0, 0.8, -3.8);
  sc.add(workSpot);
  sc.add(workSpot.target);

  // 4 Structural Corner I-Beam Columns with Safety Bases
  [[-7.8, -7.8], [7.8, -7.8], [-7.8, 7.8], [7.8, 7.8]].forEach(cp => {
    const colGroup = new THREE.Group();
    colGroup.position.set(cp[0], 2.2, cp[1]);

    fl1.position.z = 0.2;

    wrap.position.y = -1.8;
    colGroup.add(web, fl1, fl2, wrap);
    sc.add(colGroup);

  // High-Resolution Wall Safety Signage & Conduit Lines
  function makeWallSignTexture(txt, bgColor, fgColor) {
    const sc2 = document.createElement('canvas'); sc2.width = 512; sc2.height = 160;

  // Danger High Voltage Sign on Back Wall

      if (typeof window.emitRuntimeEvent === 'function') {
        window.emitRuntimeEvent(
          hitId || topG.userData?.label || 'component',
          'INTERACT',
          stepIdx + 1,
          isCorrectStep ? 'COMPLETED' : 'NON_COMPLIANT',
          `Interacted with ${topG.userData?.label || hitId || 'machinery component'}`
        );
      }
      
      if(isCorrectStep){
        beep(880, 0.15);
        stepIdx++;
        updateHUD();
      } else {
        say("Inspected " + (topG.userData?.label || "object") + ". Follow current step.", true);
      }
    }
  });

  // Inject Custom HUD & VR Header — preserve the <canvas> element!
  // Remove all overlay children (hud, toolbar, d-pad, etc.) but keep the canvas
  Array.from(sw.children).forEach(ch => {
    if(ch.tagName !== 'CANVAS') ch.remove();
  });
  
  // Inject AI-specific HUD panels as new child elements
  const aiHudWrap = document.createElement('div');
  aiHudWrap.innerHTML = `
    <div style="position:absolute;left:14px;top:14px;z-index:5;background:#0f1720dd;backdrop-filter:blur(8px);border:1.5px solid var(--ac);border-radius:12px;padding:12px 16px;max-width:380px;color:#fff">
      <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a3a4a;padding-bottom:6px;margin-bottom:6px">
        <b style="font-size:15px;color:var(--tx)">${spec.title}</b>
        <span class="tag a" style="font-size:10px">AI GENERATED</span>
      </div>
      <div id="ai-hud"></div>
    </div>
    
    <div style="position:absolute;right:14px;top:14px;z-index:5;display:flex;gap:8px">
      <button class="b o" id="btn-thermal-ai" onclick="toggleThermalVision()" style="padding:6px 12px;font-size:12px;background:#0b1220cc" title="Toggle Thermal / X-Ray Heat Camera (T)">🌡️ Thermal [T]</button>
      <button class="b o" onclick="showAIHazardsModal()" style="padding:6px 12px;font-size:12px;background:#0b1220cc">⚠️ Hazards (${(spec.hazards||[]).length})</button>
      <button class="b" onclick="go('ai3d')" style="padding:6px 12px;font-size:12px">✕ Exit Scenario</button>
    </div>
    
    <div class="sb" style="justify-content:space-between">
      <div style="display:flex;gap:8px;align-items:center">
        <span>🎮 Controls: <b>WASD</b> Move · <b>Drag</b> Look 360° · <b>Click</b> Interact</span>
        <button class="b o" onclick="triggerSimVoiceAI()" style="padding:4px 10px;font-size:12px;margin-left:8px">🎤 Voice AI (V)</button>
      </div>
      <button id="vr-btn" class="b" style="background:#22c55e;color:#04180b;padding:8px 14px;font-size:13px">🥽 ENTER WEBXR VR</button>
    </div>
  `;
  while(aiHudWrap.firstChild) sw.appendChild(aiHudWrap.firstChild);
  
  updateHUD();
  
  // Hazards Modal Handler
  window.showAIHazardsModal = () => {
    const list = (spec.hazards || []).map(h => `<li style="margin:6px 0">${h}</li>`).join('');
    const m = document.createElement('div');
    m.style.cssText = 'position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:99;padding:14px';
    m.innerHTML = `
      <div style="background:#0f1722;border:2px solid var(--crit);border-radius:14px;max-width:440px;width:100%;padding:20px;color:#fff">
        <h3 style="margin:0 0 10px;color:#f87171">⚠️ OSHA / NSDC Safety Hazards Identified</h3>
        <ul style="padding-left:20px;font-size:14px;line-height:1.5">${list}</ul>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px">
          <button class="b" onclick="go('ai3d')">Generate Another Scenario</button>
          <button class="b o" onclick="this.closest('div[style*=fixed]').remove()">Close</button>
        </div>
      </div>
    `;
    document.body.appendChild(m);
  };
  
  // WebXR VR Button
  const vrb = document.getElementById('vr-btn');
  if(vrb && navigator.xr){
    navigator.xr.isSessionSupported('immersive-vr').then(sup => {
      if(sup){
        vrb.onclick = async () => {
          try {
            const s = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor', 'bounded-floor'] });
            R.xr.setSession(s);
            say("Entering WebXR immersive environment.", true);
          } catch(e) {
            alert('Could not start WebXR: ' + e.message);
          }
        };
      } else {
        vrb.textContent = '🖥️ DESKTOP 3D MODE';
        vrb.disabled = true;
      }
    }).catch(() => { vrb.style.display = 'none'; });
  } else if(vrb) {
    vrb.textContent = '🖥️ DESKTOP 3D MODE';
    vrb.disabled = true;
  }
  
  // Resize handler
  const onResize = () => {
    const w = cv.clientWidth || window.innerWidth;
    const h = cv.clientHeight || (window.innerHeight - 140);
    cam.aspect = w / h;
    cam.updateProjectionMatrix();
    R.setSize(w, h, false);
  };
  window.addEventListener('resize', onResize);
  setTimeout(onResize, 50);
  
  // Render Loop
  let lastT = performance.now();
  function simLoop(time, frame){
    if(!me.run) return;
    const dt = Math.min((time - lastT) / 1000, 0.1);
    lastT = time;
    
    // WASD Movement
    const spd = 3.2 * dt;
    const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    const rgt = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
    
    if(keys['w'] || keys['arrowup']) { pos.x += fwd.x * spd; pos.z += fwd.z * spd; }
    if(keys['s'] || keys['arrowdown']) { pos.x -= fwd.x * spd; pos.z -= fwd.z * spd; }
    if(keys['a'] || keys['arrowleft']) { pos.x -= rgt.x * spd; pos.z -= rgt.z * spd; }
    if(keys['d'] || keys['arrowright']) { pos.x += rgt.x * spd; pos.z += rgt.z * spd; }
    
    pos.x = Math.max(-7.2, Math.min(7.2, pos.x));
    pos.z = Math.max(-7.2, Math.min(7.2, pos.z));
    
    if(!R.xr.isPresenting){
      cam.position.set(pos.x, pos.y, pos.z);
      cam.rotation.order = 'YXZ';
      cam.rotation.y = yaw;
      cam.rotation.x = pitch;
    }
    
    // Animate Particles
    if(pSys && pPos){
      const cnt = pPos.length / 3;
      for(let i=0; i<cnt; i++){
        pPos[i*3+1] += 0.015;
        pPos[i*3] += (Math.random() - 0.5) * 0.008;
        if(pPos[i*3+1] > 3.0){
          pPos[i*3+1] = 1.0;
          pPos[i*3] = (Math.random() - 0.5) * 0.3;
        }
      }
      pGeo.attributes.position.needsUpdate = true;
    }
    
    if(typeof updateArcFlashFX === 'function') updateArcFlashFX(0.016);
    if(typeof updateThermalVisionTick === 'function') updateThermalVisionTick(0.016);
    
    const simFrame = (window._simFrameCounter = (window._simFrameCounter || 0) + 1);
    if(window._holoHUD && window._holoHUD.userData && window._holoHUD.userData.renderHoloHUD) {
      if(simFrame % 12 === 0) { window._holoHUD.userData.renderHoloHUD(); window._holoHUD.userData.texture.needsUpdate = true; }
      window._holoHUD.position.y = window._holoHUD.userData.y0 + Math.sin(simFrame * 0.04) * 0.025;
      window._holoHUD.lookAt(cam.position);
    }

    // Smooth real-time floating oscillation for 3D holographic hazard markers
    if(window.active3DHazardMarkers && window.active3DHazardMarkers.length > 0){
      window.active3DHazardMarkers.forEach(hm => {
        hm.position.y = hm.userData.baseY + Math.sin(time * 0.0035 + (hm.userData.phase || 0)) * 0.08;
      });
    }

    if(window.shakeTrauma > 0.01) {
      cam.position.x += (Math.random() - 0.5) * window.shakeTrauma * 0.12;
      cam.position.y += (Math.random() - 0.5) * window.shakeTrauma * 0.12;
      window.shakeTrauma *= 0.92;
    }
    R.render(sc, cam);
  }
  R.setAnimationLoop(simLoop);
}
</script>
